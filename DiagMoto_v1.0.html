<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#00B56A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diag Moto">
<title>Diag Moto v1.0 — Vammo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green:#00B56A; --green-dk:#007D4A; --green-lt:#E6F9F1; --green-lt2:#C8F0DF;
    --amber:#F59E0B; --amber-lt:#FFFBEB; --amber-dk:#92400E;
    --red:#EF4444; --red-lt:#FEF2F2; --red-dk:#991B1B;
    --blue:#3B82F6; --blue-lt:#EFF6FF;
    --purple:#8B5CF6; --purple-lt:#F5F3FF;
    --gray:#6B7280; --gray-lt:#F9FAFB;
    --bg:#F0F4F0; --surface:#FFFFFF; --border:#E5E7EB;
    --text:#111827; --text-2:#6B7280;
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --font:'DM Sans', sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}

  #app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);position:relative}

  /* ── Top bar ── */
  #topbar{display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;min-height:56px}
  .iconbtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--gray-lt);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s}
  .iconbtn:active{background:var(--border)}
  .iconbtn svg{width:18px;height:18px;stroke:var(--text)}
  .iconbtn.hidden{visibility:hidden}
  #btn-restart{background:transparent}
  #btn-restart svg{stroke:var(--text-2)}
  #topbar-center{flex:1;min-width:0}
  #topbar-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #topbar-step{font-size:11px;color:var(--text-2);margin-top:1px}

  #progress-bar{height:2px;background:var(--border);flex-shrink:0}
  #progress-fill{height:100%;background:var(--green);width:0%;transition:width .35s ease}

  #scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #content{padding:20px 16px calc(24px + var(--safe-bottom));display:flex;flex-direction:column;gap:12px}

  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

  /* ── Header card ── */
  #header-card{padding:18px;border-left:4px solid var(--green);transition:border-color .2s}
  #header-card .card-top{display:flex;align-items:flex-start;gap:12px}
  #type-badge{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0;background:var(--green-lt);color:var(--green-dk)}
  #header-texts{flex:1;min-width:0}
  #node-section{font-size:11px;font-weight:600;color:var(--green);margin-bottom:3px}
  #node-title{font-size:17px;font-weight:600;line-height:1.35}
  #node-subtitle{margin-top:10px;font-size:14px;color:var(--text-2);line-height:1.5;display:none}

  #body-card{padding:16px 18px}
  #body-card p{font-size:15px;line-height:1.65;white-space:pre-line}

  #instr-card{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--green-lt);border:1.5px solid var(--green-lt2);border-radius:var(--radius);text-decoration:none;cursor:pointer}
  #instr-card:active{background:var(--green-lt2)}
  #instr-card.hidden{display:none}
  .instr-icon{width:36px;height:36px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .instr-icon svg{width:18px;height:18px;stroke:#fff}
  .instr-texts{flex:1}
  .instr-texts strong{display:block;font-size:13px;font-weight:600;color:var(--green-dk)}
  .instr-texts span{font-size:12px;color:var(--green)}
  .instr-arrow{color:var(--green);font-size:18px}

  .options-label{font-size:12px;font-weight:600;color:var(--text-2);padding:0 2px}

  .btn-option{width:100%;border:none;border-radius:var(--radius);padding:16px 18px;font-family:var(--font);font-size:15px;font-weight:500;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:transform .1s,opacity .1s;box-shadow:var(--shadow);margin-bottom:10px}
  .btn-option:active{transform:scale(.98);opacity:.9}
  .btn-primary{background:var(--green);color:#fff}
  .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-menu{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-menu .menu-num{width:26px;height:26px;background:var(--green-lt);color:var(--green-dk);border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .btn-menu .menu-label{flex:1;line-height:1.4}
  .btn-menu .menu-arrow{color:var(--text-2);font-size:18px;flex-shrink:0}

  .accent-result{--acc:var(--green);--acc-lt:var(--green-lt);--acc-dk:var(--green-dk)}
  .accent-escalate{--acc:var(--red);--acc-lt:var(--red-lt);--acc-dk:var(--red-dk)}
  .accent-action{--acc:var(--amber);--acc-lt:var(--amber-lt);--acc-dk:var(--amber-dk)}
  .accent-info{--acc:var(--purple);--acc-lt:var(--purple-lt);--acc-dk:#5B21B6}
  .accent-menu{--acc:var(--green);--acc-lt:var(--green-lt);--acc-dk:var(--green-dk)}
  .accent-question{--acc:var(--blue);--acc-lt:var(--blue-lt);--acc-dk:#1E40AF}
  [class*="accent-"] #header-card{border-left-color:var(--acc)}
  [class*="accent-"] #type-badge{background:var(--acc-lt);color:var(--acc-dk)}
  [class*="accent-"] #node-section{color:var(--acc)}
  [class*="accent-"] .btn-primary{background:var(--acc);color:#fff}
  [class*="accent-"] .btn-menu .menu-num{background:var(--acc-lt);color:var(--acc-dk)}

  /* ── Session pill (OS + e-mail) ── */
  #session-pill{display:none;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--text-2);align-self:flex-start}
  #session-pill b{color:var(--text);font-weight:600}
  #session-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

  /* ── Log status (on terminal nodes) ── */
  #log-status{display:none;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius);font-size:13px;line-height:1.4}
  #log-status.ok{display:flex;background:var(--green-lt);color:var(--green-dk);border:1px solid var(--green-lt2)}
  #log-status.queued{display:flex;background:var(--amber-lt);color:var(--amber-dk);border:1px solid #FDE68A}
  #log-status.off{display:flex;background:var(--gray-lt);color:var(--text-2);border:1px solid var(--border)}
  .field small a{color:var(--green-dk);font-weight:600}
  #log-status.recusado{display:flex;background:var(--amber-lt);color:var(--red-dk);border:1px solid #FDE68A}
  #log-status svg{width:18px;height:18px;flex-shrink:0}

  /* ── Start screen ── */
  #start{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10}
  #start.hidden{display:none}
  #start-inner{flex:1;overflow-y:auto;padding:max(28px,env(safe-area-inset-top)) 20px calc(24px + var(--safe-bottom));display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:480px;margin:0 auto;width:100%}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo-mark{width:44px;height:44px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center}
  .logo-mark svg{width:24px;height:24px;stroke:#fff}
  .logo h1{font-size:22px;font-weight:600;line-height:1.1}
  .logo p{font-size:13px;color:var(--text-2)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13px;font-weight:600;color:var(--text)}
  .field input{font-family:var(--font);font-size:16px;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);outline:none;width:100%}
  .field input:focus{border-color:var(--green)}
  .field input.invalid{border-color:var(--red)}
  .field small{font-size:12px;color:var(--text-2)}
  .field small.err{color:var(--red-dk)}
  #btn-start{width:100%;border:none;border-radius:var(--radius);padding:16px;font-family:var(--font);font-size:16px;font-weight:600;background:var(--green);color:#fff;cursor:pointer;box-shadow:var(--shadow);margin-top:4px}
  #btn-start:active{transform:scale(.98)}
  #start-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-2);margin-top:8px}
  #start-foot .ind{display:flex;align-items:center;gap:6px}
  #start-foot .ind i{width:8px;height:8px;border-radius:50%;background:var(--gray);display:inline-block}
  #start-foot .ind.on i{background:var(--green)}
  #start-foot .ind.warn i{background:var(--amber)}

  @keyframes slide-in-right{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes slide-in-left{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
  #content.anim-forward{animation:slide-in-right .22s ease both}
  #content.anim-back{animation:slide-in-left .22s ease both}
  @media (prefers-reduced-motion:reduce){#content.anim-forward,#content.anim-back{animation:none}}
  #scroll::-webkit-scrollbar{width:4px}
  #scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<div id="app" class="accent-menu">

  <!-- ── Tela de identificação ── -->
  <div id="start">
    <div id="start-inner">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <div>
          <h1>Diag Moto</h1>
          <p>Diagnóstico eletrônico CPX / Comfort</p>
        </div>
      </div>

      <div class="field">
        <label for="in-email">Seu e-mail Vammo</label>
        <input id="in-email" type="email" inputmode="email" autocomplete="email" placeholder="nome@vammo.com" autocapitalize="off" spellcheck="false">
        <small id="email-hint">Fica salvo neste aparelho para as próximas vezes.</small>
      </div>

      <div class="field">
        <label for="in-os">Número da OS</label>
        <input id="in-os" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Ex.: 33006" autocomplete="off">
        <small id="os-hint">Número da ordem de serviço no Maestro.</small>
      </div>

      <button id="btn-start" onclick="startSession()">Iniciar diagnóstico</button>

      <div id="start-foot">
        <span id="ver-label"></span>
        <span class="ind" id="log-ind"><i></i><span>verificando log…</span></span>
      </div>
    </div>
  </div>

  <!-- ── Barra superior ── -->
  <div id="topbar">
    <button id="btn-back" class="iconbtn hidden" onclick="goBack()" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div id="topbar-center">
      <div id="topbar-title">Diag Moto</div>
      <div id="topbar-step" style="display:none"></div>
    </div>
    <button id="btn-restart" class="iconbtn hidden" onclick="restart()" aria-label="Encerrar e voltar ao início">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <div id="progress-bar"><div id="progress-fill"></div></div>

  <div id="scroll">
    <div id="content">

      <div id="session-pill"><span class="dot"></span><span>OS <b id="pill-os"></b></span><span>·</span><span id="pill-email"></span></div>

      <div class="card" id="header-card">
        <div class="card-top">
          <div id="type-badge"></div>
          <div id="header-texts">
            <div id="node-section"></div>
            <div id="node-title"></div>
          </div>
        </div>
        <div id="node-subtitle"></div>
      </div>

      <div class="card" id="body-card" style="display:none"><p id="node-body"></p></div>

      <a id="instr-card" class="hidden" target="_blank" rel="noopener">
        <div class="instr-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <div class="instr-texts"><strong>Instrução de Trabalho</strong><span>Toque para abrir o documento</span></div>
        <span class="instr-arrow">↗</span>
      </a>

      <div id="log-status"></div>

      <div id="options-label" class="options-label" style="display:none">Selecione uma opção</div>
      <div id="options-container"></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CONFIGURAÇÃO
//  Cole aqui a URL do Web App do Google Apps Script (termina em /exec).
//  Enquanto estiver vazia, o app funciona normalmente mas não registra o log.
// ═══════════════════════════════════════════════════════════════════
const LOG_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzyoGcfIr833YyLWNjDWqcX_A0DZWA_REsZeszRqmbOced4OYxJ0ihFbpio1vNszB1b/exec';
const APP_VERSION  = 'v1.2';
const EMAIL_DOMAIN = 'vammo.com';   // domínio exigido no e-mail (deixe '' para aceitar qualquer)
// Log que VALE para o x3 da moto eletrônica no card de diag (Master Ops, regra de 27/10/2026): só conta
// o fluxo que chegou aqui. A planilha acima continua recebendo, mas é POST no-cors (diz "ok" até
// falhando), então "registrado" na tela só aparece quando a Master Ops responde {ok:true}.
const TORRE_LOG    = 'https://control-tower-diag-qa.pages.dev/diag_app_log';
// Login Google do app de check-in do carrinho (mesmo site → mesmo localStorage). O celular é do
// carrinho e passa de mão em mão: e-mail digitado ficava salvo com o dono anterior.
const LS_CARRINHO  = 'vammo_user';
const CARRINHO_MAX_MS = 10 * 60 * 60 * 1000;   // mesma janela de sessão do check-in

// ─── Fluxo de diagnóstico ───────────────────────────────────────────
const FLOW = {"nodes":[{"id":"ROOT","type":"menu","title":"Diagnóstico Eletrônico","subtitle":"Selecione o sintoma da moto","instructionUrl":null,"options":[{"label":"Moto não liga / painel pisca e desliga","nextId":"NL_P1"},{"label":"Moto liga mas não anda","nextId":"LA_MENU"},{"label":"Moto liga mas apresenta problema","nextId":"SF_MENU"},{"label":"Erro intermitente","nextId":"ERRO_INTERMITENTE"}]},{"id":"NL_P1","type":"question","section":"Moto não liga","title":"Passo 1 — Baterias","body":"As baterias estão carregadas e conectadas?","instructionUrl":null,"options":[{"label":"Sim","nextId":"NL_P2"},{"label":"Não","nextId":"NL_P1_N"}]},{"id":"NL_P1_N","type":"action","section":"Moto não liga","title":"Trocar / conectar baterias","body":"Troque ou conecte as baterias corretamente e reinicie o diagnóstico.","instructionUrl":null,"options":[{"label":"Reiniciar diagnóstico","nextId":"ROOT"}]},{"id":"NL_P2","type":"question","section":"Moto não liga","title":"Passo 2 — Tensão na controladora","body":"Há tensão chegando na controladora?\n\nUse um multímetro: meça o fio vermelho (+) e preto (−) na controladora com o disjuntor ligado, em modo DC.","instructionUrl":null,"options":[{"label":"Sim — há tensão","nextId":"NL_P3"},{"label":"Não — sem tensão","nextId":"NL_P2_N"}]},{"id":"NL_P2_N","type":"question","section":"Moto não liga","title":"Passo 2 — Verificar disjuntor","body":"Há tensão da bateria na entrada do disjuntor?","instructionUrl":null,"options":[{"label":"Sim","nextId":"NL_P2_N_S"},{"label":"Não","nextId":"NL_P2_N_N"}]},{"id":"NL_P2_N_S","type":"question","section":"Moto não liga","title":"Passo 2 — Terminais do disjuntor","body":"Aperte os terminais do disjuntor e verifique os cabos. A moto funciona normalmente?","instructionUrl":null,"options":[{"label":"Sim — funcionou","nextId":"NL_OK_FLUXO"},{"label":"Não — não funcionou","nextId":"NL_OK_DISJUNTOR_TROCA"}]},{"id":"NL_OK_DISJUNTOR_TROCA","type":"result","section":"Moto não liga","title":"✅ Fluxo normal de "nextId":"LA_ENG"}]},{"id":"SF_EST_A","type":"question","section":"Moto liga mas apresenta problema","title":"Estralos/queimado — Passo A — Disjuntor","body":"Os cabos estão corretamente encaixados no disjuntor e os terminais apertados?","instructionUrl":null,"options":[{"label":"Sim — estão ok","nextId":"SF_EST_B"},{"label":"Não — há folga","nextId":"SF_EST_A_APERTO"}]},{"id":"SF_EST_A_APERTO","type":"question","section":"Moto liga mas apresenta problema","title":"Estralos/queimado — Passo A — Aperto dos terminais","body":"Realize o posicionamento correto e o aperto dos terminais do disjuntor. O problema foi resolvido?","instructionUrl":null,"options":[{"label":"Sim — resolvido","nextId":"SF_OK_FLUXO"},{"label":"Não — persiste","nextId":"SF_EST_A_DISJ"}]},{"id":"SF_OK_FLUXO","type":"result","section":"Moto liga mas apresenta problema","title":"✅ Fluxo normal de diagnóstico","body":"Problema resolvido.","instructionUrl":null,"options":[{"label":"Voltar ao início","nextId":"ROOT"}]},{"id":"SF_EST_A_DISJ","type":"question","section":"Moto liga mas apresenta problema","title":"Estralos/queimado — Passo A — Disjuntor de teste","body":"Use o disjuntor de teste. O problema foi resolvido?","instructionUrl":null,"options":[{"label":"Sim — resolvido","nextId":"SF_OK_DISJ"},{"label":"Não — persiste","nextId":"SF_EST_B"}]},{"id":"SF_OK_DISJ","type":"result","section":"Moto liga mas apresenta problema","title":"✅ Fluxo normal de diagnóstico","body":"Solicitar troca do disjuntor.","instructionUrl":null,"options":[{"label":"Voltar ao início","nextId":"ROOT"}]},{"id":"SF_EST_B","type":"question","section":"Moto liga mas apresenta problema","title":"Estralos/queimado — Passo B — Controladora","body":"A controladora apresenta algum dano na carcaça ou no conector de comunicação?","instructionUrl":null,"options":[{"label":"Sim — há dano","nextId":"SF_EST_B_CTRL"},{"label":"Não — está ok","nextId":"SF_ENG"}]},{"id":"SF_EST_B_CTRL","type":"question","section":"Moto liga mas apresenta problema","title":"Estralos/queimado — Passo B — Controladora de teste","body":"Use a controladora de teste. O erro desaparece?","instructionUrl":null,"options":[{"label":"Sim — erro sumiu","nextId":"ERR_OK_CTRL"},{"label":"Não — erro persiste","nextId":"SF_EST_CHISEC_DANIF"}]},{"id":"SF_EST_CHISEC_DANIF","type":"question","section":"Moto liga mas apresenta problema","title":"Estralos/queimado — Passo B — Chicote secundário","body":"O chicote secundário está danificado ou esmagado?","instructionUrl":null,"options":[{"label":"Sim — está danificado","nextId":"SF_EST_CHISEC_TESTE"},{"label":"Não — está ok","nextId":"SF_ENG"}]},{"id":"SF_EST_CHISEC_TESTE","type":"question","section":"Moto liga mas apresenta problema","title":"Estralos/queimado — Passo B — Chicote secundário de teste","body":"Use o chicote secundário de teste. A moto funciona normalmente?","instructionUrl":null,"options":[{"label":"Sim — funcionou","nextId":"SF_OK_CHISEC"},{"label":"Não — não funcionou","nextId":"SF_EST_MOTOR_CABOS"}]},{"id":"SF_OK_CHISEC","type":"result","section":"Moto liga mas apresenta problema","title":"✅ Fluxo normal de diagnóstico","body":"Solicitar troca do chicote secundário.","instructionUrl":null,"options":[{"label":"Voltar ao início","nextId":"ROOT"}]},{"id":"SF_EST_MOTOR_CABOS","type":"question","section":"Moto liga mas apresenta problema","title":"Estralos/queimado — Passo B — Cabos do motor","body":"Os cabos do motor estão danificados ou esmagados?","instructionUrl":null,"options":[{"label":"Sim — estão danificados","nextId":"SF_EST_MOTOR_TESTE"},{"label":"Não — estão ok","nextId":"SF_ENG"}]},{"id":"SF_EST_MOTOR_TESTE","type":"question","section":"Moto liga mas apresenta problema","title":"Estralos/queimado — Passo B — Motor de teste","body":"Instale o motor de testes. O erro desaparece?","instructionUrl":null,"options":[{"label":"Sim — erro sumiu","nextId":"ERR_OK_MOTOR"},{"label":"Não — erro persiste","nextId":"SF_ENG"}]}]};

const nodeMap = {};
FLOW.nodes.forEach(n => nodeMap[n.id] = n);

const TYPE_CONFIG = {
  menu:     { icon:'≡', accentClass:'accent-menu' },
  question: { icon:'?', accentClass:'accent-question' },
  result:   { icon:'✓', accentClass:'accent-result' },
  action:   { icon:'→', accentClass:'accent-action' },
  escalate: { icon:'!', accentClass:'accent-escalate' },
  info:     { icon:'i', accentClass:'accent-info' },
};
const MENU_IDS = new Set(FLOW.nodes.filter(n => n.type === 'menu').map(n => n.id));

// ─── Estado ─────────────────────────────────────────────────────────
let history = [];        // ids visitados (pilha)
let currentId = 'ROOT';
let direction = 1;
let session = null;      // { email, os, startedAt, sintoma, subSintoma:[], path:[], logged }

const LS_EMAIL = 'diag_email';
const LS_QUEUE = 'diag_log_queue';

// ─── Tela inicial ───────────────────────────────────────────────────
// E-mail de quem está logado no check-in do carrinho, se a sessão ainda vale. Senão, null.
function emailDoCarrinho() {
  try {
    const u = JSON.parse(localStorage.getItem(LS_CARRINHO) || 'null');
    const t = u && u.ts ? new Date(u.ts).getTime() : 0;
    const e = u && u.email ? String(u.email).trim().toLowerCase() : '';
    if (e && validEmail(e) && t && Date.now() - t < CARRINHO_MAX_MS) return e;
  } catch (e) {}
  return null;
}
let emailTravado = false;   // true = veio do login do carrinho
function aplicaEmailCarrinho() {
  const el = document.getElementById('in-email');
  const h  = document.getElementById('email-hint');
  const e  = emailDoCarrinho();
  emailTravado = !!e;
  el.readOnly = emailTravado;
  if (e) {
    el.value = e;
    h.className = '';
    h.innerHTML = 'Logado no carrinho. <a href="#" id="email-trocar">Não sou eu</a>';
    document.getElementById('email-trocar').onclick = (ev) => {
      ev.preventDefault(); emailTravado = false; el.readOnly = false; el.value = ''; el.focus();
      h.textContent = 'Digite o SEU e-mail: o diagnóstico conta para este e-mail.';
    };
  } else {
    // nunca herdar o e-mail que estava travado do carrinho: só o último DIGITADO neste aparelho
    el.value = localStorage.getItem(LS_EMAIL) || '';
    h.className = '';
    h.textContent = 'Confira se é o SEU e-mail: o diagnóstico conta para ele.';
  }
}
function initStart() {
  document.getElementById('ver-label').textContent = 'Diag Moto ' + APP_VERSION;
  aplicaEmailCarrinho();
  updateLogIndicator();
  flushQueue();
  document.getElementById('in-os').addEventListener('keydown', e => { if (e.key === 'Enter') startSession(); });
}

function updateLogIndicator() {
  const el = document.getElementById('log-ind');
  const q  = getQueue().length;
  if (!TORRE_LOG) { el.className = 'ind'; el.lastElementChild.textContent = 'log não configurado'; return; }
  if (q > 0)         { el.className = 'ind warn'; el.lastElementChild.textContent = q + ' registro(s) aguardando envio'; return; }
  el.className = 'ind on'; el.lastElementChild.textContent = 'log ativo';
}

function validEmail(v) {
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return false;
  if (EMAIL_DOMAIN && !v.toLowerCase().endsWith('@' + EMAIL_DOMAIN)) return false;
  return true;
}

function startSession() {
  const emailEl = document.getElementById('in-email');
  const osEl    = document.getElementById('in-os');
  const email   = emailEl.value.trim().toLowerCase();
  const os      = osEl.value.trim();
  let ok = true;

  if (!validEmail(email)) {
    emailEl.classList.add('invalid');
    const h = document.getElementById('email-hint');
    h.className = 'err'; h.textContent = EMAIL_DOMAIN ? 'Use seu e-mail @' + EMAIL_DOMAIN + '.' : 'Digite um e-mail válido.';
    ok = false;
  } else { emailEl.classList.remove('invalid'); }

  if (!/^\d{3,}$/.test(os)) {
    osEl.classList.add('invalid');
    const h = document.getElementById('os-hint');
    h.className = 'err'; h.textContent = 'Digite o número da OS (somente dígitos).';
    ok = false;
  } else { osEl.classList.remove('invalid'); }

  if (!ok) return;

  if (!emailTravado) localStorage.setItem(LS_EMAIL, email);
  session = { email, os, startedAt: new Date().toISOString(), sintoma: '', subSintoma: [], path: [], logged: false,
              fonteEmail: emailTravado ? 'carrinho' : 'digitado' };

  document.getElementById('pill-os').textContent = os;
  document.getElementById('pill-email').textContent = email;
  document.getElementById('session-pill').style.display = 'flex';
  document.getElementById('start').classList.add('hidden');

  history = []; currentId = 'ROOT'; direction = 1;
  render(nodeMap['ROOT']);
}

function endSession() {
  session = null;
  document.getElementById('session-pill').style.display = 'none';
  document.getElementById('in-os').value = '';
  document.getElementById('os-hint').className = '';
  document.getElementById('os-hint').textContent = 'Número da ordem de serviço no Maestro.';
  document.getElementById('start').classList.remove('hidden');
  aplicaEmailCarrinho();   // outro mecânico pode ter logado no carrinho nesse meio-tempo
  flushQueue();
  updateLogIndicator();
  setTimeout(() => document.getElementById('in-os').focus(), 50);
}

// ─── Navegação ──────────────────────────────────────────────────────
function choose(opt) {
  if (!session) return;
  if (currentId === 'ROOT') session.sintoma = opt.label;
  else if (MENU_IDS.has(currentId)) session.subSintoma.push(opt.label);

  if (opt.nextId === 'ROOT') { endSession(); return; }   // "Voltar ao início" encerra a sessão

  history.push(currentId);
  session.path.push(currentId);
  direction = 1;
  currentId = opt.nextId;
  render(nodeMap[currentId]);
}

function goBack() {
  if (!history.length) return;
  const prev = history.pop();
  session.path.pop();
  if (currentId === 'ROOT' || MENU_IDS.has(prev)) {
    // voltando para um menu: desfaz a escolha de sintoma correspondente
    if (prev === 'ROOT') { session.sintoma = ''; session.subSintoma = []; }
    else session.subSintoma.pop();
  }
  direction = -1;
  currentId = prev;
  render(nodeMap[prev]);
}

function restart() {
  if (history.length && !confirm('Encerrar este diagnóstico sem registrar resultado?')) return;
  endSession();
}

function isTerminal(node) {
  if (node.type === 'result' || node.type === 'escalate' || node.type === 'info') return true;
  if (node.type === 'action' && node.options.length && node.options.every(o => o.nextId === 'ROOT')) return true;
  return false;
}

// ─── Render ─────────────────────────────────────────────────────────
function render(node) {
  const cfg = TYPE_CONFIG[node.type] || TYPE_CONFIG.question;
  const isMenu = node.type === 'menu';
  const atRoot = node.id === 'ROOT';

  const content = document.getElementById('content');
  content.classList.remove('anim-forward', 'anim-back');
  void content.offsetWidth;
  content.classList.add(direction > 0 ? 'anim-forward' : 'anim-back');

  document.getElementById('app').className = cfg.accentClass;

  document.getElementById('btn-back').classList.toggle('hidden', history.length === 0);
  document.getElementById('btn-restart').classList.remove('hidden');
  const stepEl = document.getElementById('topbar-step');
  stepEl.style.display = atRoot ? 'none' : 'block';
  stepEl.textContent = 'Passo ' + history.length;
  document.getElementById('topbar-title').textContent = (node.section && !isMenu) ? node.section : 'Diag Moto';

  const pct = atRoot ? 0 : Math.min(history.length / 15 * 100, 95);
  document.getElementById('progress-fill').style.width = pct + '%';

  document.getElementById('type-badge').textContent = cfg.icon;
  const secEl = document.getElementById('node-section');
  secEl.style.display = node.section ? 'block' : 'none';
  secEl.textContent = node.section || '';
  document.getElementById('node-title').textContent = node.title;

  const sub = document.getElementById('node-subtitle');
  sub.style.display = node.subtitle ? 'block' : 'none';
  sub.textContent = node.subtitle || '';

  const bodyCard = document.getElementById('body-card');
  bodyCard.style.display = node.body ? 'block' : 'none';
  document.getElementById('node-body').textContent = node.body || '';

  const instr = document.getElementById('instr-card');
  if (node.instructionUrl) { instr.href = node.instructionUrl; instr.classList.remove('hidden'); }
  else instr.classList.add('hidden');

  document.getElementById('options-label').style.display = (!isMenu && node.options.length > 1) ? 'block' : 'none';

  const cont = document.getElementById('options-container');
  cont.innerHTML = '';
  node.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    if (isMenu) {
      btn.className = 'btn-option btn-menu';
      btn.innerHTML = `<span class="menu-num">${i + 1}</span><span class="menu-label"></span><span class="menu-arrow">›</span>`;
      btn.querySelector('.menu-label').textContent = opt.label;
    } else {
      btn.className = 'btn-option ' + ((i === 0 || node.options.length === 1) ? 'btn-primary' : 'btn-secondary');
      btn.textContent = opt.label;
    }
    btn.onclick = () => choose(opt);
    cont.appendChild(btn);
  });

  // Log no primeiro nó terminal da sessão
  const ls = document.getElementById('log-status');
  ls.className = ''; ls.innerHTML = '';
  if (isTerminal(node) && session && !session.logged) {
    session.logged = true;
    logResult(node);
  } else if (isTerminal(node) && session && session.logged) {
    showLogStatus(session.lastStatus);
  }

  document.getElementById('scroll').scrollTop = 0;
}

// ─── Log ────────────────────────────────────────────────────────────
function buildPayload(node) {
  const resultado = node.title.replace(/^[✅⚠️\s]+/, '') + (node.body ? ' — ' + node.body.split('\n')[0] : '');
  return {
    ts: new Date().toISOString(),
    versao: APP_VERSION,
    email: session.email,
    os: session.os,
    sintoma: session.sintoma,
    subSintoma: session.subSintoma.join(' › '),
    resultado,
    resultadoId: node.id,
    passos: history.length,
    caminho: session.path.concat(node.id).join(' > '),
    startedAt: session.startedAt,
    fonteEmail: session.fonteEmail,
  };
}

async function logResult(node) {
  const payload = buildPayload(node);
  const r = await send(payload);
  if (r === 'ok') session.lastStatus = 'ok';
  else if (r === 'recusado') session.lastStatus = 'recusado';
  else { enqueue(payload); session.lastStatus = 'queued'; }
  showLogStatus(session.lastStatus);
}

// Planilha: melhor esforço, uma vez por registro (no-cors não deixa saber se gravou).
async function sendPlanilha(payload) {
  if (!LOG_ENDPOINT || payload._planilha) return;
  try {
    await fetch(LOG_ENDPOINT, { method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    payload._planilha = true;
  } catch (e) {}
}
// Master Ops: o que vale para o x3. 'ok' só lendo {ok:true}; 'recusado' = dado inválido (reenviar
// não adianta); 'erro' = rede/servidor, fica na fila.
async function send(payload) {
  await sendPlanilha(payload);
  try {
    const r = await fetch(TORRE_LOG, { method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    if (r.status === 400) return 'recusado';
    const j = await r.json();
    return j && j.ok === true ? 'ok' : 'erro';
  } catch (e) { return 'erro'; }
}

function getQueue() { try { return JSON.parse(localStorage.getItem(LS_QUEUE) || '[]'); } catch (e) { return []; } }
function enqueue(p) { const q = getQueue(); q.push(p); localStorage.setItem(LS_QUEUE, JSON.stringify(q)); }
async function flushQueue() {
  if (!navigator.onLine) return;
  const q = getQueue(); if (!q.length) return;
  const rest = [];
  for (const p of q) { if ((await send(p)) === 'erro') rest.push(p); }
  localStorage.setItem(LS_QUEUE, JSON.stringify(rest));
  updateLogIndicator();
}
window.addEventListener('online', flushQueue);

function showLogStatus(kind) {
  const el = document.getElementById('log-status');
  const icons = {
    ok:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    queued: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    off:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
  };
  const msgs = {
    ok:     'Resultado registrado para a OS ' + (session ? session.os : '') + '.',
    queued: 'Ainda não chegou na Master Ops (sem conexão ou servidor fora). Fica salvo no aparelho e será enviado quando a internet voltar.',
    off:    'Registro de uso não configurado neste app. O diagnóstico funciona, mas nada foi gravado.',
    recusado: 'A Master Ops recusou este registro (e-mail ou OS inválidos). Avise o líder.',
  };
  icons.recusado = icons.queued;
  el.className = kind; el.innerHTML = icons[kind] + '<span>' + msgs[kind] + '</span>';
}

// ─── Boot ───────────────────────────────────────────────────────────
initStart();
</script>
